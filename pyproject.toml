[project]
name = "primitive-db"
version = "0.1.0"
description = "Учебная консольная база данных с JSON-хранилищем и CRUD-операциями"
readme = "README.md"
authors = [
    { name = "Pavel Yunakovsky", email = "4bnv94t2gr@privaterelay.appleid.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"
database = "primitive_db.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.17.3"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.poetry]
packages = [{ include = "primitive_db", from = "src" }]
